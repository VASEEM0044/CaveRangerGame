name: iOS Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build for iOS Simulator (Release)
        run: |
          xcodebuild build \
            -project CaveRangerGame.xcodeproj \
            -scheme CaveRangerGame \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || xcodebuild build -project CaveRangerGame.xcodeproj -scheme CaveRangerGame -configuration Release -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO

      - name: Archive iOS App (Unsigned for Device Target)
        run: |
          xcodebuild clean archive \
            -project CaveRangerGame.xcodeproj \
            -scheme CaveRangerGame \
            -configuration Release \
            -archivePath build/CaveRanger.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload Build Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaveRanger-xcarchive
          path: build/CaveRanger.xcarchive
          if-no-files-found: warn
