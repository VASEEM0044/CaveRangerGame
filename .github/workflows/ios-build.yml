name: Build iOS IPA (TrollStore / Physical Device)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build ARM64 Release IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Run IPA Build Script
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload CaveRanger.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaveRanger-TrollStore-IPA
          path: build/CaveRanger.ipa
          if-no-files-found: error
